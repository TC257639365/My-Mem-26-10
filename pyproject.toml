[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-mem"
version = "0.1.0"
description = "Minimal memory influence and evidence-gap validation prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
json = ["json_repair>=0.25.0"]
cost = ["tiktoken>=0.7.0"]
test = ["pytest>=8.0.0"]
tmem = [
    "numpy>=1.24.0",
    "nltk>=3.8.1",
    "rank_bm25>=0.2.2",
    "rapidfuzz>=3.6.0",
    "rich>=13.7.0",
]

[tool.setuptools.packages.find]
include = ["my_mem*", "T_mem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

